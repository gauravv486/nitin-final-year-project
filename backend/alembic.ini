# Alembic configuration.
#
# Note there is no sqlalchemy.url here. It is read from DATABASE_URL via
# app.core.config inside alembic/env.py, so the connection string lives in one
# place (.env) and cannot drift between the app and its migrations.

[alembic]
script_location = alembic
prepend_sys_path = .
# UTC timestamps in filenames, so migrations sort chronologically regardless of
# whose machine generated them.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

[post_write_hooks]
# Format the generated migration. `exec` rather than `console_scripts`: ruff
# ships a native binary placed directly in the venv's Scripts/bin, and declares
# no console_scripts entry point, so the entrypoint lookup fails with
# "Could not find entrypoint console_scripts.ruff" - and alembic then reports
# the whole revision as FAILED even though the file was written.
#
# A bare `ruff` resolves through PATH, so the virtualenv must be activated -
# which is how every other command in this project is run anyway.
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
